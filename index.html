<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zupazupazuu — Form Kebersihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EA;
    --ink:#201C16;
    --ink-soft:#8B8375;
    --ink-faint:#B8AF9E;
    --line:#D9CFB8;
    --accent:#B49A78;
    --accent-soft:#EFE7D6;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    height:100vh;
    height:100dvh;
  }
  ::selection{background:var(--line);color:var(--ink);}
  .accent-italic{font-style:italic;font-weight:500;color:var(--accent);}

  /* ---------- top chrome ---------- */
  .chrome{
    position:fixed;top:28px;left:0;right:0;
    z-index:20;
    padding:0 32px;
    display:flex;justify-content:space-between;align-items:center;
    pointer-events:none;
  }
  .chrome > *{pointer-events:auto;}
  .brand-mini{
    height:22px;
    width:auto;
    opacity:0;
    transition:opacity .3s ease;
  }
  .brand-mini.show{opacity:1;}
  .chrome-right{display:flex;align-items:center;gap:14px;}

  /* ---------- stage ---------- */
  #stage{
    position:relative;
    height:100%;width:100%;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    pointer-events:none;
  }
  .screen > *{
    width:100%;max-width:520px;
  }
  .screen{
    opacity:0;
    transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .screen.active{
    opacity:1;transform:translateY(0);pointer-events:auto;
  }

  .section-pill{
    display:inline-flex;
    font-family:'Inter',sans-serif;
    font-size:0.7rem;font-weight:600;
    letter-spacing:0.16em;text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
    width:fit-content;
  }
  .q-num{
    font-family:'Inter',sans-serif;
    font-size:0.75rem;letter-spacing:0.1em;
    color:var(--accent);margin-bottom:14px;
  }
  .q-text{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(1.5rem,4.5vw,1.9rem);
    line-height:1.3;
    margin:0 0 20px;
  }
  .q-sub{
    font-family:'Inter',sans-serif;
    color:var(--ink-soft);
    font-size:0.92rem;
    line-height:1.65;
    margin-bottom:26px;
    max-width:52ch;
  }

  input[type="text"].tf-input, textarea.tf-input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'Cormorant Garamond',serif;
    font-size:1.4rem;
    font-weight:400;
    padding:6px 2px 14px;
    color:var(--ink);
    transition:border-color .2s ease;
  }
  input[type="text"].tf-input::placeholder, textarea.tf-input::placeholder{color:var(--line);}
  input[type="text"].tf-input:focus, textarea.tf-input:focus{outline:none;border-color:var(--ink);}
  textarea.tf-input{resize:none;min-height:90px;font-size:1.15rem;line-height:1.5;}

  .opt-list{display:flex;flex-wrap:wrap;gap:10px;}
  .opt-row{
    font-family:'Inter',sans-serif;
    font-size:0.82rem;
    padding:11px 20px;
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    color:var(--ink-soft);
    background:transparent;
    transition:all 0.15s ease;
    user-select:none;
  }
  .opt-row:hover{border-color:var(--accent);color:var(--ink);}
  .opt-row.selected{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }
  .opt-text{font-size:inherit;font-weight:inherit;line-height:1.4;}
  .opt-text em{font-style:normal;opacity:.7;}
  .opt-row.other-row{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:8px 2px 12px;
    margin-top:4px;
    background:transparent;
  }
  .opt-row.other-row:hover{border-color:var(--ink);}
  .opt-row.other-row.selected{background:transparent;color:var(--ink);border-color:var(--ink);}
  .opt-other-input{
    width:100%;border:none;background:transparent;
    font-family:'Cormorant Garamond',serif;font-size:1.15rem;
    padding:2px 0;color:var(--ink);
  }
  .opt-other-input:focus{outline:none;}
  .opt-other-input::placeholder{color:var(--line);}

  .upload-zone{
    border:1px dashed var(--line);
    padding:30px 16px;
    text-align:center;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    background:transparent;
    transition:border-color .15s ease;
  }
  .upload-zone:hover{border-color:var(--accent);}
  .upload-zone.has-img{padding:12px;}
  .upload-zone input{display:none;}
  .up-icon{width:32px;height:32px;color:var(--ink-soft);margin:0 auto 12px;}
  .up-hint{font-size:0.82rem;color:var(--ink-soft);}
  .up-hint b{color:var(--ink);font-weight:500;}
  .preview-wrap{position:relative;}
  .preview-wrap img{width:100%;max-height:280px;object-fit:cover;display:block;border:1px solid var(--line);}
  .remove-img{
    position:absolute;top:10px;right:10px;
    background:rgba(32,28,22,0.75);color:#fff;border:none;
    width:28px;height:28px;font-size:15px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }

  .err-msg{
    font-family:'Inter',sans-serif;
    font-size:0.75rem;color:#A85C4A;margin-top:14px;
    display:none;
  }
  .err-msg.show{display:block;}

  /* ---------- nav ---------- */
  .nav-bar{
    position:fixed;bottom:0;left:0;right:0;
    padding:24px;
    display:flex;justify-content:center;
    z-index:20;
    pointer-events:none;
  }
  .nav-bar-inner{
    width:100%;max-width:520px;
    display:flex;align-items:center;justify-content:space-between;
    pointer-events:auto;
  }
  .nav-btn{
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    letter-spacing:0.04em;
    background:none;
    border:none;
    cursor:pointer;
    padding:8px 0;
    transition:color .15s ease;
  }
  .nav-btn.next{color:var(--ink);font-weight:500;}
  .nav-btn.next:hover{color:var(--accent);}
  .nav-btn.next:disabled{color:var(--ink-faint);cursor:not-allowed;}
  .nav-btn.back{color:var(--ink-soft);}
  .nav-btn.back:hover{color:var(--ink);}
  .nav-btn.back.hidden{visibility:hidden;}
  .enter-hint{
    font-family:'Inter',sans-serif;
    font-size:11px;color:var(--ink-faint);
    display:none;
  }
  @media(min-width:680px){.enter-hint{display:inline;margin-left:4px;}}

  /* ---------- intro ---------- */
  #intro{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:48px 24px;
    opacity:1;transition:opacity .4s ease, transform .4s ease;
  }
  #intro.hide{opacity:0;transform:translateY(-24px);pointer-events:none;}
  .wordmark-logo{
    width:min(190px, 40vw);
    height:auto;
    margin:0 auto 18px;
  }
  .brand-tag{
    font-family:'Inter',sans-serif;
    font-size:0.75rem;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.12em;
    margin-bottom:22px;
  }
  .start-btn{
    font-family:'Inter',sans-serif;font-size:0.85rem;letter-spacing:0.04em;
    background:none;color:var(--ink);border:none;
    cursor:pointer;padding:8px 0;
    margin-top:20px;
    transition:color .15s ease;
  }
  .start-btn:hover{color:var(--accent);}

  /* ---------- final ---------- */
  #final{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:0 24px;
    opacity:0;transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #final.show{display:flex;}
  #final.active{opacity:1;transform:translateY(0);}
  .final-eyebrow{
    font-family:'Inter',sans-serif;
    font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:16px;
  }
  #final .q-text{font-size:2.1rem;margin-bottom:18px;}
  .final-sub{font-family:'Inter',sans-serif;color:var(--ink-soft);font-size:0.95rem;max-width:44ch;line-height:1.65;margin-bottom:26px;}
  .final-cheers{font-style:italic;color:var(--accent);margin-bottom:26px;}
  .again-btn{
    font-family:'Inter',sans-serif;font-size:0.82rem;
    background:none;color:var(--ink-soft);border:none;
    cursor:pointer;letter-spacing:0.02em;
    padding:8px 0;
    transition:color .15s ease;
  }
  .again-btn:hover{color:var(--ink);}

  /* ---------- riwayat overlay ---------- */
  #riwayat-overlay{
    position:fixed;inset:0;background:var(--bg);
    z-index:40;display:none;
    overflow-y:auto;
    padding:80px 6vw 60px;
  }
  #riwayat-overlay.open{display:block;}
  .riwayat-close{
    position:fixed;top:18px;right:22px;
    background:var(--white);border:1px solid var(--line);
    width:38px;height:38px;border-radius:10px;
    font-size:18px;cursor:pointer;z-index:41;
  }
  .riwayat-title{font-family:'Inter',sans-serif;font-weight:800;font-size:26px;margin:0 auto 24px;max-width:640px;}
  .hist-item{
    max-width:640px;margin:0 auto 14px;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;
  }
  .hist-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .hist-name{font-weight:700;font-size:16px;}
  .hist-time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
  .hist-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:6px;}
  .hist-notes{font-size:13.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .hist-imgs{display:flex;gap:8px;margin-top:8px;}
  .hist-imgs img{width:calc(50% - 4px);height:110px;object-fit:cover;border-radius:8px;cursor:pointer;}
  .hist-empty,.hist-loading{max-width:640px;margin:40px auto;text-align:center;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(23,26,23,0.9);z-index:50;align-items:center;justify-content:center;padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;}

  @media(max-width:480px){
    .chrome{top:18px;padding:0 20px;}
    .nav-bar{padding:18px 20px;}
  }
</style>
</head>

  {
    id:'ruanganBersama', section:'', type:'choice-multi',
    q:'Ruangan bersama mana yang kamu bersihkan?', sub:'Opsional — pilih yang relevan.',
    options:[
      'Ruang Parkir','Ruang Makan','Ruang Tamu','Ruang Terbuka Belakang',
      'Ruang Event','Kamar Mandi Lantai 1','Kamar Mandi Lantai 2'
    ],
    other:false, required:false
  },
  {
    id:'waktu', section:'', type:'choice-multi',
    q:'Kapan kamu membersihkannya?', sub:'',
    options:['Pagi (Sebelum Bekerja)','Pulang (Setelah Bekerja)'],
    other:false, required:true
  },
  {
    id:'imgBefore', section:'', type:'upload',
    q:'Foto ruangan sebelum dibersihkan', sub:'Ambil sebelum kamu mulai bekerja.', required:true
  },
  {
    id:'pekerjaan', section:'', type:'choice-multi',
    q:'Apa saja yang kamu kerjakan?', sub:'Boleh pilih lebih dari satu.',
    options:['Menyapu','Pel','Membersihkan Meja','Menata Display','Lap Kaca / Cermin','Buang Sampah'],
    other:true, required:true
  },
  {
    id:'imgAfter', section:'', type:'upload',
    q:'Foto ruangan setelah dibersihkan', sub:'Ambil setelah semua selesai.', required:true
  },
  {
    id:'notes', section:'', type:'textarea',
    q:'Ada catatan tambahan?', sub:'Opsional — ceritakan kalau ada kendala atau hal lain.', placeholder:'Tulis di sini...', required:false
  }
];

let answers = { nama:'', ruanganKerja:[], ruanganKerjaOther:'', ruanganBersama:[], waktu:[], imgBefore:null, pekerjaan:[], pekerjaanOther:'', imgAfter:null, notes:'' };
let current = -1; // -1 = intro
let animating = false;

const container = document.getElementById('steps-container');
const navBar = document.getElementById('nav-bar');

// build all step DOM up front (hidden), simpler + faster switching
steps.forEach((step, i)=>{
  const div = document.createElement('div');
  div.className = 'screen';
  div.id = 'screen-'+i;
  div.innerHTML = renderStep(step, i);
  container.appendChild(div);
});

function renderStep(step, i){
  let inner = `
    ${step.section ? `<div class="section-pill">${step.section}</div>` : ''}
    <div class="q-text">${step.q}</div>
    ${step.sub ? `<div class="q-sub">${step.sub}</div>` : '<div style="margin-bottom:26px"></div>'}
  `;
  if(step.type==='text'){
    inner += `<input type="text" class="tf-input" id="input-${step.id}" placeholder="${step.placeholder||''}" value="${escapeAttr(answers[step.id])}">`;
  } else if(step.type==='textarea'){
    inner += `<textarea class="tf-input" id="input-${step.id}" placeholder="${step.placeholder||''}">${escapeAttr(answers[step.id])}</textarea>`;
  } else if(step.type==='choice-multi'){
    inner += `<div class="opt-list" id="optlist-${step.id}">`;
    step.options.forEach((opt)=>{
      const selected = answers[step.id].includes(opt);
      inner += `<div class="opt-row ${selected?'selected':''}" data-value="${escapeAttr(opt)}" onclick="toggleOption('${step.id}', this)">
        <span class="opt-text">${opt}</span>
      </div>`;
    });
    if(step.other){
      const otherKey = step.id+'Other';
      const hasOther = answers[otherKey] && answers[otherKey].length>0;
      inner += `<div class="opt-row other-row ${hasOther?'selected':''}" id="otherrow-${step.id}">
        <input type="text" class="opt-other-input" id="otherinput-${step.id}" placeholder="Lainnya... (isi sendiri)" value="${escapeAttr(answers[otherKey]||'')}">
      </div>`;
    }
    inner += `</div>`;
  } else if(step.type==='upload'){
    const img = answers[step.id];
    inner += `
      <label class="upload-zone ${img?'has-img':''}" id="upload-${step.id}">
        <input type="file" accept="image/*" onchange="handleImage(event,'${step.id}')">
        <div id="uploadinner-${step.id}">
          ${img ? uploadPreviewHtml(step.id) : uploadEmptyHtml()}
        </div>
      </label>`;
  }
  inner += `<div class="err-msg" id="err-${step.id}">Mohon lengkapi bagian ini.</div>`;
  return inner;
}

function uploadEmptyHtml(){
  return `<svg class="up-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 9l5-5 5 5M12 4v13"/></svg>
  <div class="up-hint"><b>Tap untuk upload</b> atau seret foto ke sini</div>`;
}
function uploadPreviewHtml(id){
  return `<div class="preview-wrap"><img src="${answers[id]}"><button type="button" class="remove-img" onclick="removeImage(event,'${id}')">✕</button></div>`;
}

function escapeAttr(str){
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ---------------------------------------------------------------
// navigation
// ---------------------------------------------------------------
function startForm(){
  document.getElementById('intro').classList.add('hide');
  document.getElementById('brand-mini').classList.add('show');
  navBar.style.display = 'flex';
  setTimeout(()=>{ goToStep(0); }, 150);
}

function goToStep(index, direction){
  if(current>=0){
    const cur = document.getElementById('screen-'+current);
    cur.classList.remove('active');
  }
  current = index;
  updateChrome();
  const next = document.getElementById('screen-'+current);
  requestAnimationFrame(()=>{ next.classList.add('active'); });
  document.getElementById('btn-back').classList.toggle('hidden', current===0);
  focusCurrentInput();
}

function updateChrome(){
  // no-op: progress bar removed to match reference design
}

function focusCurrentInput(){
  const step = steps[current];
  if(step.type==='text' || step.type==='textarea'){
    setTimeout(()=>{
      const el = document.getElementById('input-'+step.id);
      if(el) el.focus({preventScroll:true});
    }, 380);
  }
}

function collectCurrent(){
  const step = steps[current];
  if(step.type==='text' || step.type==='textarea'){
    answers[step.id] = document.getElementById('input-'+step.id).value.trim();
  }
  if(step.type==='choice-multi' && step.other){
    answers[step.id+'Other'] = document.getElementById('otherinput-'+step.id).value.trim();
  }
}

function validateCurrent(){
  const step = steps[current];
  if(!step.required) return true;
  if(step.type==='text' || step.type==='textarea'){
    return answers[step.id].length>0;
  }
  if(step.type==='choice-multi'){
    const hasOther = step.other && answers[step.id+'Other'] && answers[step.id+'Other'].length>0;
    return answers[step.id].length>0 || hasOther;
  }
  if(step.type==='upload'){
    return !!answers[step.id];
  }
  return true;
}

function goNext(){
  if(animating) return;
  collectCurrent();
  if(!validateCurrent()){
    const errEl = document.getElementById('err-'+steps[current].id);
    errEl.classList.add('show');
    return;
  }
  document.getElementById('err-'+steps[current].id).classList.remove('show');
  if(current < steps.length-1){
    goToStep(current+1);
  } else {
    submitForm();
  }
}

function goBack(){
  if(current<=0 || animating) return;
  collectCurrent();
  goToStep(current-1);
}

document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const active = document.activeElement;
    if(active && active.tagName==='TEXTAREA') return; // allow newline
    if(document.getElementById('riwayat-overlay').classList.contains('open')) return;
    if(current>=0 && current<steps.length){
      e.preventDefault();
      goNext();
    } else if(current===-1){
      const introVisible = !document.getElementById('intro').classList.contains('hide');
      if(introVisible) startForm();
    }
  }
});

// ---------------------------------------------------------------
// choice interactions
// ---------------------------------------------------------------
function toggleOption(stepId, el){
  const value = el.getAttribute('data-value');
  const idx = answers[stepId].indexOf(value);
  if(idx>-1){ answers[stepId].splice(idx,1); el.classList.remove('selected'); }
  else { answers[stepId].push(value); el.classList.add('selected'); }
}

// live-bind "other" input selected styling
container.addEventListener('input', (e)=>{
  if(e.target.classList.contains('opt-other-input')){
    const row = e.target.closest('.opt-row');
    row.classList.toggle('selected', e.target.value.trim().length>0);
  }
});

// ---------------------------------------------------------------
// image upload
// ---------------------------------------------------------------
function handleImage(event, stepId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
      answers[stepId] = dataUrl;
      const zone = document.getElementById('upload-'+stepId);
      zone.classList.add('has-img');
      document.getElementById('uploadinner-'+stepId).innerHTML = uploadPreviewHtml(stepId);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeImage(event, stepId){
  event.preventDefault(); event.stopPropagation();
  answers[stepId] = null;
  const zone = document.getElementById('upload-'+stepId);
  zone.classList.remove('has-img');
  document.getElementById('uploadinner-'+stepId).innerHTML = uploadEmptyHtml();
}

// ---------------------------------------------------------------
// submit -> Google Sheets (via Apps Script Web App)
// ---------------------------------------------------------------
async function submitForm(){
  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.innerHTML = 'Mengirim...';

  let ruanganKerjaList = [...answers.ruanganKerja];
  if(answers.ruanganKerjaOther) ruanganKerjaList.push(answers.ruanganKerjaOther);
  let pekerjaanList = [...answers.pekerjaan];
  if(answers.pekerjaanOther) pekerjaanList.push(answers.pekerjaanOther);

  const submission = {
    nama: answers.nama,
    ruanganKerja: ruanganKerjaList,
    ruanganBersama: answers.ruanganBersama,
    waktu: answers.waktu,
    pekerjaan: pekerjaanList,
    notes: answers.notes,
    imgBefore: answers.imgBefore,
    imgAfter: answers.imgAfter,
    submittedAt: new Date().toISOString()
  };

  try{
    if(!GAS_URL || GAS_URL.indexOf('PASTE_YOUR') === 0){
      throw new Error('GAS_URL belum diisi. Tempel URL Apps Script kamu di bagian atas file ini.');
    }

    // Using text/plain + no-cors avoids CORS preflight issues with Apps Script.
    // We can't read the response in no-cors mode, so we treat "no network error" as success.
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(submission)
    });

    document.getElementById('screen-'+current).classList.remove('active');
    navBar.style.display = 'none';
    document.getElementById('brand-mini').classList.remove('show');
    const final = document.getElementById('final');
    final.classList.add('show');
    requestAnimationFrame(()=>final.classList.add('active'));
  }catch(err){
    console.error('Gagal mengirim:', err);
    document.getElementById('err-'+steps[current].id).textContent = 'Gagal mengirim laporan. Coba lagi.';
    document.getElementById('err-'+steps[current].id).classList.add('show');
  }finally{
    btn.disabled = false;
    btn.innerHTML = 'Lanjut <span>→</span><span class="enter-hint">tekan Enter ↵</span>';
  }
}

function restartForm(){
  answers = { nama:'', ruanganKerja:[], ruanganKerjaOther:'', ruanganBersama:[], waktu:[], imgBefore:null, pekerjaan:[], pekerjaanOther:'', imgAfter:null, notes:'' };
  container.innerHTML='';
  steps.forEach((step, i)=>{
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'screen-'+i;
    div.innerHTML = renderStep(step, i);
    container.appendChild(div);
  });
  const final = document.getElementById('final');
  final.classList.remove('active');
  setTimeout(()=>{ final.classList.remove('show'); }, 300);
  current = -1;
  document.getElementById('intro').classList.remove('hide');
  document.getElementById('brand-mini').classList.remove('show');
}

// ---------------------------------------------------------------
// riwayat -> reads history back from the Google Sheet (via doGet)
// ---------------------------------------------------------------
async function openRiwayat(){
  document.getElementById('riwayat-overlay').classList.add('open');
  const listEl = document.getElementById('riwayat-list');
  listEl.innerHTML = '<div class="hist-loading">Memuat riwayat...</div>';
  try{
    if(!GAS_URL || GAS_URL.indexOf('PASTE_YOUR') === 0){
      throw new Error('GAS_URL belum diisi.');
    }
    const res = await fetch(GAS_URL, { method: 'GET' });
    const data = await res.json();
    const entries = (data && data.entries) ? data.entries : [];
    listEl.innerHTML = entries.length ? entries.map(entryHtml).join('') : '<div class="hist-empty">Belum ada laporan yang masuk.</div>';
  }catch(err){
    console.error(err);
    listEl.innerHTML = '<div class="hist-empty">Gagal memuat riwayat.</div>';
  }
}
function closeRiwayat(){ document.getElementById('riwayat-overlay').classList.remove('open'); }

function entryHtml(e){
  const d = new Date(e.submittedAt);
  const timeStr = d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const tags = [...(e.ruanganKerja||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`), ...(e.waktu||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`)].join('');
  const imgs = (e.imgBefore||e.imgAfter) ? `<div class="hist-imgs">${e.imgBefore?`<img src="${e.imgBefore}" onclick="openLightbox('${e.imgBefore.replace(/'/g,"\\'")}')">`:''}${e.imgAfter?`<img src="${e.imgAfter}" onclick="openLightbox('${e.imgAfter.replace(/'/g,"\\'")}')">`:''}</div>` : '';
  const pekerjaan = (e.pekerjaan&&e.pekerjaan.length) ? `<div class="hist-notes"><b>Pekerjaan:</b> ${escapeHtml(e.pekerjaan.join(', '))}</div>` : '';
  const bersama = (e.ruanganBersama&&e.ruanganBersama.length) ? `<div class="hist-notes"><b>Ruang bersama:</b> ${escapeHtml(e.ruanganBersama.join(', '))}</div>` : '';
  const notes = e.notes ? `<div class="hist-notes"><b>Catatan:</b> ${escapeHtml(e.notes)}</div>` : '';
  return `<div class="hist-item">
    <div class="hist-top"><div class="hist-name">${escapeHtml(e.nama||'(tanpa nama)')}</div><div class="hist-time">${timeStr}</div></div>
    <div class="hist-tags">${tags}</div>${bersama}${pekerjaan}${notes}${imgs}
  </div>`;
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function openLightbox(src){ document.getElementById('lightbox-img').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
</script>
